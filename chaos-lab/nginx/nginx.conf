worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format chaos_lb '$remote_addr - [$time_local] "$request" '
                        'status=$status upstream=$upstream_addr '
                        'upstream_status=$upstream_status '
                        'req_time=${request_time}s upstream_time=${upstream_response_time}s '
                        'req_id="$http_x_request_id" xff="$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log chaos_lb;
    error_log /var/log/nginx/error.log warn;

    upstream orders_backend {
        zone orders_backend 64k;
        least_conn;
        server host.docker.internal:8081 max_fails=2 fail_timeout=5s;
        server host.docker.internal:8082 max_fails=2 fail_timeout=5s;
        keepalive 64;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    server {
        listen 8080;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://orders_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 6s;

            # Strict HTTP semantics: do not set non_idempotent so POST requests are not
            # replayed after bytes were sent; passive max_fails still isolates a dead node.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;

            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}

