spring:
  application:
    name: ordersservice
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 20s

  cache:
    type: redis   # tells Spring to use Redis (not in-memory/caffeine)

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.trusted.packages: com.hk.common.dto
        max.block.ms: 1000
        request.timeout.ms: 1500
        delivery.timeout.ms: 2000
  
  flyway:
    enabled: true
    locations: classpath:db/migration
  
  datasource:
    hikari:
      connection-timeout: 1500
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      redis:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallDurationThreshold: 200ms
        slowCallRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

# Spring Boot Actuator & Prometheus Metrics
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: orders-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
        resilience4j.circuitbreaker.calls: true

# Rate limiting configuration
rate-limit:
  max-requests: 10
  window-seconds: 60
  rate-limit-enabled: true
  strategy: fixed-window

# Transactional outbox relay configuration
outbox:
  relay:
    enabled: true
    poll-interval-ms: 1000
    batch-size: 50
    max-retries: 50
    max-backoff-seconds: 30
    stale-lock-seconds: 60

---
# --- means start of a new doc
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/ecommerce_system
    username: postgres
    password: pass
    driver-class-name: org.postgresql.Driver

logging:
  level:
    org.springframework.transaction: INFO
    org.hibernate: INFO

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

rate-limit:
  rate-limit-enabled: false

outbox:
  relay:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_management_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:pass}
    driver-class-name: org.postgresql.Driver